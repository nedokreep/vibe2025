<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item" disabled>
    <button onclick="addItem()" disabled>Add</button>
</div>

<script>
    let items = [];
    let editingId = null;

    function renderList() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';

        items.forEach((item, index) => {
            const row = document.createElement('tr');
            if (editingId === item.id) {
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="text" class="edit-input" id="editInput-${item.id}" value="${item.text}"></td>
                    <td>
                        <button onclick="saveEdit(${item.id})">Save</button>
                        <button onclick="cancelEdit()">Cancel</button>
                    </td>
                `;
            } else {
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.text}</td>
                    <td>
                        <button onclick="startEdit(${item.id})">Edit</button>
                        <button onclick="removeItem(${index})" disabled>Remove</button>
                    </td>
                `;
            }
            listBody.appendChild(row);
        });
    }

    function startEdit(id) {
        editingId = id;
        renderList();
    }

    function saveEdit(id) {
        const newText = document.getElementById(`editInput-${id}`).value.trim();
        if (newText) {
            const itemIndex = items.findIndex(item => item.id === id);
            if (itemIndex !== -1) {
                items[itemIndex].text = newText;
            }
        }
        editingId = null;
        renderList();
    }

    function cancelEdit() {
        editingId = null;
        renderList();
    }

    function addItem() {
        // Disabled in this branch
    }

    function removeItem(index) {
        // Disabled in this branch
    }

    // Initialize with sample data
    items = [
        { id: 1, text: 'First todo item' },
        { id: 2, text: 'Second todo item' }
    ];
    renderList();
</script>

</body>
</html>
